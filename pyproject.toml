[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-analyzer"
version = "1.0.0"
description = "A privacy-conscious resume analysis and job recommendation demo."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2.0",
    "openai>=1.50,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]